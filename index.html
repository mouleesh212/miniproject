<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <h2 >Login</h2>
  <input type="text" id="username" placeholder="Enter your name"><br><br>
  <input type="password" id="password" placeholder="Enter your password"><br><br>
  <select id="role">
    <option value="admin">Admin</option>
    
  </select>
  <button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <h1>📚 Library Management System</h1>
  <button onclick="logout()" class="logout-btn">Logout</button>

  <!-- DASHBOARD -->
  <div class="dashboard">
    <div>Total Books: <span id="total">0</span></div>
    <div>Issued Books: <span id="issued">0</span></div>
    <div>Available Books: <span id="available">0</span></div>
  </div>

  <!-- SEARCH -->
  <input type="text" id="search" placeholder="🔍 Search by title or author" onkeyup="searchBooks()">

  <!-- ADD BOOK (Admin only) -->
  <div class="form" id="bookForm">
    <input type="text" id="title" placeholder="Book Title">
    <input type="text" id="author" placeholder="Author Name">
    <button onclick="addBook()">Add Book</button>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Status</th>
        <th>User</th>
        <th>Issue Date</th>
        <th>Return Date</th>
        <th>Fine (₹)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookList"></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
